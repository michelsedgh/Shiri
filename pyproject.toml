[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "shiri-audio"
version = "2.0.0"
description = "Room-based whole-house audio and speech routing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "dbus-next==0.2.3",
]

[project.optional-dependencies]
audio = ["aiortc>=1.14,<2", "av>=16.1,<17", "numpy>=1.24,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
shiri = "shiri.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shiri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"shiri/runtime/*.py" = ["ASYNC240"]
"shiri/rpc.py" = ["ASYNC240"]
