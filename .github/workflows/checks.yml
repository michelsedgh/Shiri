name: Checks
on:
  push:
  pull_request:
jobs:
  control-and-audio:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa libjson-c-dev libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libsbc-dev pkg-config
      - name: Enable ALSA loopback when the runner kernel provides it
        run: sudo modprobe snd-aloop || echo 'This runner lacks snd-aloop; the ALSA bridge check will explicitly skip.'
      - name: Install project and verification tools
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r install/build_requirements.lock
          .venv/bin/pip install --no-build-isolation '.[audio,test]'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Python validation and real PCM mixer
        env:
          SHIRI_LINUX_AUDIO_TESTS: '1'
        run: |
          .venv/bin/ruff check shiri tests
          .venv/bin/python -m pytest -q
      - name: Native source and volume parser checks
        run: |
          .venv/bin/python tests/native/check_source_transition.py --require-json --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_native_anchor.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_packet_timestamps.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_framed_output.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_alsa_partial_write.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_bluealsa_drop_sync.py --compiler /usr/bin/cc --require-sbc
      - name: Browser and frontend validation
        env:
          SHIRI_BROWSER_TESTS: '1'
        run: node --test tests/web/*.test.mjs
