name: Checks
on:
  push:
  pull_request:
jobs:
  control-and-audio:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv libasound2 libjson-c-dev libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libsbc-dev pkg-config
      - name: Install project and verification tools
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r install/build_requirements.lock
          .venv/bin/pip install --no-build-isolation '.[audio,test]'
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Python validation and native audio contracts
        run: |
          .venv/bin/ruff check shiri tests
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import stat
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          owners = {(0, 0), (os.getuid(), os.getgid())}
          for path in (root, *root.parents):
              info = path.stat()
              if not stat.S_ISDIR(info.st_mode) or (info.st_uid, info.st_gid) not in owners or info.st_mode & 0o022:
                  raise RuntimeError(f'Pytest policy fixtures require protected ancestors: {path}')
          PY
          .venv/bin/python -m pytest -q --basetemp="$RUNNER_TEMP/shiri-pytest"
      - name: Native source and volume parser checks
        run: |
          .venv/bin/python tests/native/check_source_transition.py --require-json --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_native_anchor.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_packet_timestamps.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_framed_output.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_alsa_partial_write.py --compiler /usr/bin/cc
          .venv/bin/python tests/native/check_bluealsa_drop_sync.py --compiler /usr/bin/cc --require-sbc
      - name: Browser and frontend validation
        env:
          SHIRI_BROWSER_TESTS: '1'
        run: node --test tests/web/*.test.mjs
